version: '3.8'

services:
  gmail-to-telegram:
    build: .
    container_name: gmail-to-telegram-bot
    restart: unless-stopped
    volumes:
      # Mount credentials and token files
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      # Optional: mount data directory for persistent storage
      - ./data:/app/data
    environment:
      # Load environment variables from .env file
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    env_file:
      - .env
    # Optional: Set custom check interval (in minutes)
    # command: ["python", "email_to_telegram.py", "10"]
