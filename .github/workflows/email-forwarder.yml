name: Gmail to Telegram Forwarder

on:
  # Allow manual trigger
  workflow_dispatch:

jobs:
  forward-emails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Create credentials.json from secret
      run: |
        cat > credentials.json <<'EOF'
        ${{ secrets.GMAIL_CREDENTIALS }}
        EOF
        
    - name: Create token.json from secret (if exists)
      run: |
        if [ -n "${{ secrets.GMAIL_TOKEN }}" ]; then
          cat > token.json <<'EOF'
        ${{ secrets.GMAIL_TOKEN }}
        EOF
        fi
        
    - name: Set up environment variables
      run: |
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_ENV
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV
        
    - name: Run email forwarder
      run: |
        python email_to_telegram.py --once
